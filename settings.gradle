pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// Work around Gradle on Windows failing when this generated report already exists.
def staleProblemsReport = file("build/reports/problems/problems-report.html")
if (staleProblemsReport.exists()) {
    staleProblemsReport.delete()
}
def gradleTmpDir = new File(gradle.gradleUserHomeDir, ".tmp")
if (gradleTmpDir.exists()) {
    gradleTmpDir.eachFileMatch(~/problems-report.*\.html/) { it.delete() }
}

rootProject.name = "test1"
include(":app")
